services:
  plex-webhook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bloomin8-plex-webhook
    restart: unless-stopped

    # BLE wake goes through the host's BlueZ daemon; the frame itself is reached over the LAN.
    #network_mode: host
    ports:
      - 57071:80
    volumes:
      # bleak drives the host's bluetoothd over the D-Bus system bus, not the HCI device.
      - /run/dbus:/run/dbus:ro
      # Saved frame state must outlive the container or restore has nothing to return to.
      - ./bloomin8-state:/home/site/wwwroot/bloomin8-state

    # BLOOMIN8_MAC, BLOOMIN8_IP, PLEX_SERVER_URL and PLEX_TOKEN live here.
    env_file:
      - .env

    environment:
      #FUNCTIONS_WORKER_RUNTIME: python
      # Keeps function keys on the container filesystem instead of Azure Storage.
      #AzureWebJobsSecretStorageType: files

      BLOOMIN8_MAC: ${BLOOMIN8_MAC}
      BLOOMIN8_IP: ${BLOOMIN8_IP}
      BLOOMIN8_MANAGED_GALLERIES: ${BLOOMIN8_MANAGED_GALLERIES}
      PLEX_SERVER_URL: ${PLEX_SERVER_URL}
      PLEX_TOKEN: ${PLEX_TOKEN}
      PROCESS_OWNER_PLAYBACK_ONLY: ${PROCESS_OWNER_PLAYBACK_ONLY:-true}
      PROCESS_LOCAL_PLAYBACK_ONLY: ${PROCESS_LOCAL_PLAYBACK_ONLY:-true}
      STOP_DEBOUNCE_SECONDS: ${STOP_DEBOUNCE_SECONDS:-20}

