services:
  bloomin8-azfunc-webhook:
    build:
      context: .
      dockerfile: Dockerfile.azure-functions
    restart: unless-stopped
    # BLE wake goes through the host's BlueZ daemon; the frame itself is reached over the LAN.
    #network_mode: host
    ports:
      - 7071:80
    volumes:
      # bleak drives the host's bluetoothd over the D-Bus system bus, not the HCI device.
      - /run/dbus:/run/dbus:ro
      # Saved frame state must outlive the container or restore has nothing to return to.
      - ./bloomin8-state:/home/site/wwwroot/bloomin8-state

    # BLOOMIN8_MAC, BLOOMIN8_IP, WEBHOOK_PLEX_SERVER_URL and WEBHOOK_PLEX_TOKEN live here.
    env_file:
      - .env

    environment:
      # If using authenticated functions : the below keeps function keys on the container filesystem instead of Azure Storage.
      #AzureWebJobsSecretStorageType: files
      
      BLOOMIN8_MAC: ${BLOOMIN8_MAC}
      BLOOMIN8_IP: ${BLOOMIN8_IP}
      BLOOMIN8_MANAGED_GALLERIES: ${BLOOMIN8_MANAGED_GALLERIES}
      WEBHOOK_PLEX_SERVER_URL: ${WEBHOOK_PLEX_SERVER_URL}
      WEBHOOK_PLEX_TOKEN: ${WEBHOOK_PLEX_TOKEN}
      WEBHOOK_PROCESS_OWNER_PLAYBACK_ONLY: ${WEBHOOK_PROCESS_OWNER_PLAYBACK_ONLY:-true}
      WEBHOOK_PROCESS_LOCAL_PLAYBACK_ONLY: ${WEBHOOK_PROCESS_LOCAL_PLAYBACK_ONLY:-true}
      WEBHOOK_SKIP_TRACKS: ${WEBHOOK_SKIP_TRACKS:-false}
      WEBHOOK_DEFAULT_OVERWRITE_STATE: ${WEBHOOK_DEFAULT_OVERWRITE_STATE:-false}
      WEBHOOK_ACTION_ONLY_IF_IDLE: ${WEBHOOK_ACTION_ONLY_IF_IDLE:-true}
      WEBHOOK_RESTORE_DEBOUNCE_SECONDS: ${WEBHOOK_RESTORE_DEBOUNCE_SECONDS:-20}
      WEBHOOK_SHOW_DEBOUNCE_SECONDS: ${WEBHOOK_SHOW_DEBOUNCE_SECONDS:-5}

  bloomin8-srv-webhook:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    ports:
      - 7072:7072
    volumes:
      # bleak drives the host's bluetoothd over the D-Bus system bus, not the HCI device.
      - /run/dbus:/run/dbus:ro
      # Saved frame state must outlive the container or restore has nothing to return to.
      - ./bloomin8-state:/app/bloomin8-state

    # BLOOMIN8_MAC, BLOOMIN8_IP, WEBHOOK_PLEX_SERVER_URL and WEBHOOK_PLEX_TOKEN live here.
    env_file:
      - .env

    environment:
      BLOOMIN8_MAC: ${BLOOMIN8_MAC}
      BLOOMIN8_IP: ${BLOOMIN8_IP}
      BLOOMIN8_MANAGED_GALLERIES: ${BLOOMIN8_MANAGED_GALLERIES}
      WEBHOOK_PLEX_SERVER_URL: ${WEBHOOK_PLEX_SERVER_URL}
      WEBHOOK_PLEX_TOKEN: ${WEBHOOK_PLEX_TOKEN}
      WEBHOOK_PROCESS_OWNER_PLAYBACK_ONLY: ${WEBHOOK_PROCESS_OWNER_PLAYBACK_ONLY:-true}
      WEBHOOK_PROCESS_LOCAL_PLAYBACK_ONLY: ${WEBHOOK_PROCESS_LOCAL_PLAYBACK_ONLY:-true}
      WEBHOOK_SKIP_TRACKS: ${WEBHOOK_SKIP_TRACKS:-false}
      WEBHOOK_DEFAULT_OVERWRITE_STATE: ${WEBHOOK_DEFAULT_OVERWRITE_STATE:-false}
      WEBHOOK_ACTION_ONLY_IF_IDLE: ${WEBHOOK_ACTION_ONLY_IF_IDLE:-true}
      WEBHOOK_RESTORE_DEBOUNCE_SECONDS: ${WEBHOOK_RESTORE_DEBOUNCE_SECONDS:-20}
      WEBHOOK_SHOW_DEBOUNCE_SECONDS: ${WEBHOOK_SHOW_DEBOUNCE_SECONDS:-5}
      WEBHOOK_BLE_WAKE_DEBOUNCE_SECONDS: ${WEBHOOK_BLE_WAKE_DEBOUNCE_SECONDS:-0}
